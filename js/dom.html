<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body>
    <input type="text" id="miCampo">
    <p>Esto es un parrafo</p>
    <h1 name="1">encabezado 1</h1>
    <h1 class="mi-clase">encabezado 2</h1>
    <h1 class="mi-clase">encabezado 3</h1>

    <script>
        var miCampo = document.getElementById('miCampo')
        console.log(miCampo)
        miCampo.value = 1

        console.log(document.getElementsByTagName('p')[0].innerHTML)
        console.log(document.getElementsByName('1')[0])
        console.log(document.getElementsByClassName('mi-clase')[1])
    </script>
</body>
</html>
